<!doctype html>
<html lang="en" data-theme="dark" data-accent="sunflower">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morsecode WebShare</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --acc:#FACC15; --acc2:#EAB308; --accInk:#1A1400;
  --ok:#22C55E; --recv:#A78BFA; --recvBg:#412D6D;
  --warn:#F59E0B; --err:#EF4444; --info:#0EA5E9; --lime:#84CC16;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --bg:#10100D; --card:#1B1B17; --raised:#26251F; --pressed:#302F28; --line:#33322B;
  --t1:#E8E5DB; --t2:#CAC6BA; --t3:#918F86;
  --m3-r-sm:12px; --m3-r-md:16px; --m3-r-lg:24px; --m3-r-full:999px;
  --m3-e1:0 1px 2px rgba(0,0,0,.18); --m3-e2:0 2px 6px rgba(0,0,0,.14);
}
body{margin:0;background:var(--bg);color:var(--t1);font-family:var(--sans);font-size:14px;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.brandmark{width:32px;height:32px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:var(--accInk);font-weight:900}
.url-pill{flex:1;background:var(--raised);border:1px solid var(--line);border-radius:var(--m3-r-full);padding:6px 14px;font-family:var(--mono);font-size:12px;color:var(--t2);max-width:480px}
.shell{display:flex;min-height:calc(100vh - 57px)}
.wrail{width:92px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:14px 8px;display:flex;flex-direction:column;gap:6px;align-items:center}
.wrail .it{width:100%;min-height:52px;border-radius:var(--m3-r-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--t2);font-size:10px;cursor:pointer;border:0;background:transparent}
.wrail .it:hover{background:var(--raised);color:var(--t1)}
.wrail .it.on{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);font-weight:700}
.wmain{flex:1;min-width:0;overflow:auto;padding:24px}
.whead{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--m3-r-lg);padding:16px 20px;margin-bottom:18px}
.whead h2{margin:0;font-size:20px;font-weight:600}
.breadcrumbs{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--t3);margin-bottom:14px}
.breadcrumbs a{color:var(--acc);text-decoration:none;cursor:pointer}
.breadcrumbs a:hover{text-decoration:underline}
.statcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
.statcard{background:var(--card);border:1px solid var(--line);border-radius:var(--m3-r-lg);padding:16px;cursor:pointer}
.statcard:hover{box-shadow:var(--m3-e2);transform:translateY(-2px)}
.statcard b{font-size:28px;color:var(--acc);display:block;line-height:1.1}
.statcard span{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--t3);text-transform:uppercase}
.wgrid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--m3-r-lg);padding:18px}
.drop{border:2px dashed var(--line);border-radius:var(--m3-r-lg);padding:32px;text-align:center;cursor:pointer;background:color-mix(in srgb,var(--raised) 50%,transparent)}
.drop:hover{border-color:var(--acc)}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--m3-r-md);overflow:hidden}
.tbl th{text-align:left;font-family:var(--mono);font-size:10px;color:var(--t3);padding:12px 16px;border-bottom:1px solid var(--line);text-transform:uppercase}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:color-mix(in srgb,var(--t1) 4%,transparent)}
.btn{border:0;border-radius:var(--m3-r-full);padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:var(--accInk)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--t1)}
.meta{font-family:var(--mono);font-size:11px;color:var(--t3)}
.wtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.ph{border-radius:12px;aspect-ratio:1;position:relative;cursor:pointer;overflow:hidden;background:var(--raised)}
.wplayer{position:fixed;left:92px;right:0;bottom:0;display:flex;align-items:center;gap:14px;padding:12px 24px;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 20px rgba(0,0,0,.3);z-index:90}
.wsplit{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}
.quick-panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.ffold{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border:0;background:transparent;border-radius:10px;color:var(--t2);font:inherit;font-size:12px;cursor:pointer;text-align:left}
.ffold:hover{background:var(--raised);color:var(--t1)}
.ffold.on{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);font-weight:700}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:var(--m3-r-lg);max-width:900px;width:100%;max-height:90vh;overflow:auto;padding:24px;position:relative}
.toast{position:fixed;bottom:24px;right:24px;background:var(--raised);border:1px solid var(--line);border-radius:var(--m3-r-full);padding:10px 20px;font-family:var(--mono);font-size:12px;color:var(--t1);z-index:200;display:none}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brandmark">M</div>
    <div>Morsecode WebShare</div>
  </div>
  <div class="url-pill" id="ipDisplay">Connecting...</div>
  <div style="margin-left:auto;display:flex;gap:8px">
    <button class="btn sm ghost" onclick="revokeCurrentSession()">Disconnect</button>
  </div>
</div>

<div class="shell">
  <div class="wrail">
    <button class="it on" onclick="switchPage('home')"><span>🏠</span>Home</button>
    <button class="it" onclick="switchPage('files')"><span>📁</span>Files</button>
    <button class="it" onclick="switchPage('photos')"><span>🖼️</span>Photos</button>
    <button class="it" onclick="switchPage('videos')"><span>🎬</span>Videos</button>
    <button class="it" onclick="switchPage('music')"><span>🎵</span>Music</button>
    <button class="it" onclick="switchPage('apps')"><span>📱</span>Apps</button>
  </div>

  <div class="wmain" id="content">
    <div class="card" style="text-align:center;padding:48px 24px">
      <h2>Initializing WebShare...</h2>
      <p style="color:var(--t2)">Requesting approval from phone...</p>
    </div>
  </div>
</div>

<div id="modalBox" class="modal-overlay" style="display:none" onclick="closeModal(event)">
  <div class="modal" id="modalInner"></div>
</div>

<div id="toast" class="toast"></div>

<script>
let sessionToken = localStorage.getItem('morse_web_token') || '';
let currentPage = 'home';
let currentPath = '';
let selectedFiles = new Set();

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 3000);
}

async function initSession() {
  if (!sessionToken) {
    try {
      const res = await fetch('/api/v1/auth/request');
      const data = await res.json();
      sessionToken = data.token;
      localStorage.setItem('morse_web_token', sessionToken);
    } catch (e) {
      console.error(e);
    }
  }

  checkAuthStatus();
}

async function checkAuthStatus() {
  try {
    const res = await fetch('/api/v1/auth/status?token=' + encodeURIComponent(sessionToken));
    const data = await res.json();

    if (data.isApproved) {
      document.getElementById('ipDisplay').textContent = window.location.host + ' · Approved';
      render();
    } else {
      document.getElementById('content').innerHTML = `
        <div class="card" style="text-align:center;padding:48px 24px;max-width:540px;margin:40px auto">
          <div style="font-size:48px;margin-bottom:16px">🔒</div>
          <h2>Phone Approval Required</h2>
          <p style="color:var(--t2);line-height:1.6">
            A prompt has been sent to the phone. Please tap <b>Approve</b> on your device screen to grant access.
          </p>
          <div class="meta" style="margin-top:16px">Checking authorization status automatically...</div>
        </div>
      `;
      setTimeout(checkAuthStatus, 1500);
    }
  } catch (e) {
    setTimeout(checkAuthStatus, 2000);
  }
}

async function revokeCurrentSession() {
  if (sessionToken) {
    await fetch('/api/v1/auth/revoke?token=' + encodeURIComponent(sessionToken));
    localStorage.removeItem('morse_web_token');
    sessionToken = '';
    window.location.reload();
  }
}

function switchPage(page) {
  currentPage = page;
  document.querySelectorAll('.wrail .it').forEach((b, idx) => {
    b.classList.toggle('on', ['home','files','photos','videos','music','apps'][idx] === page);
  });
  render();
}

async function render() {
  const root = document.getElementById('content');
  if (currentPage === 'home') {
    let stat = { totalBytes: 128000000000, freeBytes: 64000000000, usedBytes: 64000000000 };
    try {
      const res = await fetch('/api/v1/storage', { headers: { 'x-session-token': sessionToken } });
      stat = await res.json();
    } catch {}

    root.innerHTML = `
      <div class="whead">
        <div>
          <h2>Device Storage & Transfer</h2>
          <div class="meta">Local Wi-Fi · High speed · Encrypted handshake</div>
        </div>
      </div>
      <div class="statcards">
        <div class="statcard" onclick="switchPage('photos')"><span>Photos</span><b>${(stat.photosBytes/1000000000).toFixed(1)} GB</b></div>
        <div class="statcard" onclick="switchPage('videos')"><span>Videos</span><b>${(stat.videosBytes/1000000000).toFixed(1)} GB</b></div>
        <div class="statcard" onclick="switchPage('music')"><span>Music</span><b>${(stat.musicBytes/1000000000).toFixed(1)} GB</b></div>
        <div class="statcard" onclick="switchPage('files')"><span>Free</span><b>${(stat.freeBytes/1000000000).toFixed(1)} GB</b></div>
      </div>
      <div class="wgrid2">
        <div class="card">
          <b>Storage Breakdown</b>
          <div class="meta" style="margin-top:8px">Used ${(stat.usedBytes/1000000000).toFixed(1)} GB of ${(stat.totalBytes/1000000000).toFixed(1)} GB</div>
          <div style="margin-top:14px;display:flex;gap:8px">
            <button class="btn sm" onclick="switchPage('files')">Browse All Files</button>
            <button class="btn sm ghost" onclick="downloadZip('')">Download Storage ZIP</button>
          </div>
        </div>
        <div class="card">
          <b>Upload Files to Phone</b>
          <div class="drop" onclick="triggerUpload()">
            <div style="font-size:28px">⬆️</div>
            <div style="font-weight:600;margin-top:8px">Drop files here or click to browse</div>
            <div class="meta">Saved directly into Download/Morsecode on phone</div>
          </div>
        </div>
      </div>
    `;
  } else if (currentPage === 'photos') {
    let photos = [];
    try {
      const res = await fetch('/api/v1/photos', { headers: { 'x-session-token': sessionToken } });
      photos = await res.json();
    } catch {
      photos = Array.from({length: 12}, (_, i) => ({id: 'p'+i, name: 'IMG_'+(2040+i)+'.jpg', size: 2400000}));
    }
    root.innerHTML = `
      <div class="whead">
        <div><h2>Photos (${photos.length})</h2><div class="meta">Camera, DCIM & Pictures</div></div>
        <div style="margin-left:auto"><button class="btn sm ghost" onclick="downloadZip('DCIM')">Download All as ZIP</button></div>
      </div>
      <div class="wtiles">
        ${photos.map((p, idx) => `
          <div class="ph" onclick="openPhotoLightbox('${p.name}', '${p.path || ''}', ${idx})">
            <div style="width:100%;height:100%;background:linear-gradient(135deg,#6366F1,#EC4899);display:flex;align-items:flex-end;padding:8px">
              <span style="font-size:11px;font-family:var(--mono);color:#fff">${p.name}</span>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  } else if (currentPage === 'videos') {
    let videos = [];
    try {
      const res = await fetch('/api/v1/videos', { headers: { 'x-session-token': sessionToken } });
      videos = await res.json();
    } catch {
      videos = [{name:'holiday_2019.mp4',duration:'24:12',size:144000000}];
    }
    root.innerHTML = `
      <div class="whead">
        <div><h2>Videos (${videos.length})</h2><div class="meta">Byte-range seeking via HTTP 206 Partial Content</div></div>
      </div>
      <div class="wtiles">
        ${videos.map(v => `
          <div class="ph" style="aspect-ratio:16/9;display:grid;place-items:center;background:#181818" onclick="openVideoPlayer('${v.name}', '${v.path || v.name}')">
            <div style="font-size:32px">▶</div>
            <div style="position:absolute;bottom:6px;left:8px;font-size:11px;font-family:var(--mono);color:#fff">${v.name}</div>
          </div>
        `).join('')}
      </div>
    `;
  } else if (currentPage === 'music') {
    let songs = [];
    try {
      const res = await fetch('/api/v1/music', { headers: { 'x-session-token': sessionToken } });
      songs = await res.json();
    } catch {
      songs = [{title:'Ocean Eyes',artist:'Harbour Lights',duration:'4:08'}];
    }
    root.innerHTML = `
      <div class="whead">
        <div><h2>Music (${songs.length})</h2><div class="meta">In-browser audio playback</div></div>
      </div>
      <table class="tbl">
        <thead><tr><th>Title</th><th>Artist</th><th>Duration</th><th>Action</th></tr></thead>
        <tbody>
          ${songs.map(s => `
            <tr>
              <td><b>${s.title || s.name}</b></td>
              <td>${s.artist || 'Unknown'}</td>
              <td>${s.duration || '—'}</td>
              <td>
                <button class="btn sm" onclick="playMusic('${s.title || s.name}', '${s.path || (s.name || s.title)+'.mp3'}')">Play</button>
                <button class="btn sm ghost" onclick="downloadFile('${s.path || s.name}')">Download</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } else if (currentPage === 'files') {
    let resData = { currentPath: currentPath, breadcrumbs: [], items: [] };
    try {
      const res = await fetch('/api/v1/files?path=' + encodeURIComponent(currentPath), { headers: { 'x-session-token': sessionToken } });
      resData = await res.json();
    } catch {}

    const crumbs = resData.breadcrumbs || [{ name: 'Internal storage', path: '' }];
    const items = resData.items || [];

    root.innerHTML = `
      <div class="whead">
        <div>
          <h2>File Browser</h2>
          <div class="breadcrumbs">
            ${crumbs.map((c, i) => `
              <a onclick="navigateToPath('${c.path}')">${c.name}</a> ${i < crumbs.length - 1 ? '›' : ''}
            `).join('')}
          </div>
        </div>
        <div style="margin-left:auto;display:flex;gap:8px">
          ${selectedFiles.size > 0 ? `<button class="btn sm" onclick="downloadSelectedZip()">Download Selected (${selectedFiles.size})</button>` : ''}
          <button class="btn sm ghost" onclick="downloadZip('${currentPath}')">Download Folder as ZIP</button>
        </div>
      </div>

      <div class="wsplit">
        <div class="quick-panel">
          <div class="meta" style="margin-bottom:8px">QUICK ACCESS</div>
          ${['Internal storage','Download','DCIM','Pictures','Movies','Music'].map(f => `
            <button class="ffold ${currentPath.includes(f)?'on':''}" onclick="navigateToPath('${f}')">${f}</button>
          `).join('')}
        </div>

        <div>
          <table class="tbl">
            <thead>
              <tr>
                <th style="width:36px"><input type="checkbox" onchange="toggleSelectAll(this.checked, ${JSON.stringify(items.map(x=>x.name))})"></th>
                <th>Name</th>
                <th>Size</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${items.map(it => `
                <tr>
                  <td><input type="checkbox" ${selectedFiles.has(it.name)?'checked':''} onchange="toggleItemSelect('${it.name}')"></td>
                  <td>
                    <span style="cursor:pointer" onclick="${it.isFolder ? `navigateToPath('${currentPath?currentPath+'/'+it.name:it.name}')` : `downloadFile('${it.path || it.name}')`}">
                      ${it.isFolder ? '📁' : '📄'} <b>${it.name}</b>
                    </span>
                  </td>
                  <td>${it.isFolder ? '—' : (it.size/1000000).toFixed(1) + ' MB'}</td>
                  <td>
                    ${it.isFolder ? `
                      <button class="btn sm ghost" onclick="navigateToPath('${currentPath?currentPath+'/'+it.name:it.name}')">Open</button>
                    ` : `
                      <button class="btn sm ghost" onclick="downloadFile('${it.path || it.name}')">Download</button>
                    `}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }
}

function navigateToPath(path) {
  currentPath = path;
  selectedFiles.clear();
  render();
}

function toggleItemSelect(name) {
  if (selectedFiles.has(name)) selectedFiles.delete(name);
  else selectedFiles.add(name);
  render();
}

function toggleSelectAll(checked, allNames) {
  selectedFiles.clear();
  if (checked) allNames.forEach(n => selectedFiles.add(n));
  render();
}

function downloadFile(path) {
  toast('Downloading ' + path);
  window.location.href = '/api/v1/download?path=' + encodeURIComponent(path) + '&token=' + encodeURIComponent(sessionToken);
}

function downloadZip(path) {
  toast('Streaming folder as ZIP...');
  window.location.href = '/api/v1/zip?path=' + encodeURIComponent(path) + '&token=' + encodeURIComponent(sessionToken);
}

function downloadSelectedZip() {
  const items = Array.from(selectedFiles).join(',');
  toast('Streaming ' + selectedFiles.size + ' items as ZIP...');
  window.location.href = '/api/v1/zip?path=' + encodeURIComponent(currentPath) + '&items=' + encodeURIComponent(items) + '&token=' + encodeURIComponent(sessionToken);
}

function openPhotoLightbox(name, path, idx) {
  const modal = document.getElementById('modalBox');
  const inner = document.getElementById('modalInner');
  inner.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <h3>${name}</h3>
      <button class="btn sm ghost" onclick="closeModal()">✕ Close</button>
    </div>
    <div style="display:grid;place-items:center;min-height:360px;background:#050505;border-radius:12px;overflow:hidden">
      <img src="/api/v1/download?path=${encodeURIComponent(path || name)}&token=${encodeURIComponent(sessionToken)}" style="max-width:100%;max-height:70vh;object-fit:contain" onerror="this.src='';this.alt='Photo preview (Simulated)';">
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:14px">
      <button class="btn sm ghost" onclick="downloadFile('${path || name}')">Download Original</button>
    </div>
  `;
  modal.style.display = 'flex';
}

function openVideoPlayer(name, path) {
  const modal = document.getElementById('modalBox');
  const inner = document.getElementById('modalInner');
  inner.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <h3>${name}</h3>
      <button class="btn sm ghost" onclick="closeModal()">✕ Close</button>
    </div>
    <video controls autoplay style="width:100%;max-height:70vh;background:#000;border-radius:12px">
      <source src="/api/v1/download?path=${encodeURIComponent(path || name)}&token=${encodeURIComponent(sessionToken)}" type="video/mp4">
    </video>
  `;
  modal.style.display = 'flex';
}

function playMusic(title, path) {
  toast('Playing ' + title);
  let bar = document.getElementById('webAudioPlayer');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'webAudioPlayer';
    bar.className = 'wplayer';
    document.body.appendChild(bar);
  }
  bar.innerHTML = `
    <div style="font-size:24px">🎵</div>
    <div style="flex:1"><b>${title}</b><div class="meta">Streaming from phone</div></div>
    <audio controls autoplay src="/api/v1/download?path=${encodeURIComponent(path || title)}&token=${encodeURIComponent(sessionToken)}"></audio>
    <button class="btn sm ghost" onclick="document.getElementById('webAudioPlayer').remove()">✕</button>
  `;
}

function closeModal(e) {
  if (!e || e.target.id === 'modalBox' || e.target.tagName === 'BUTTON') {
    document.getElementById('modalBox').style.display = 'none';
  }
}

function triggerUpload() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.multiple = true;
  inp.onchange = async () => {
    if (!inp.files.length) return;
    toast('Uploading ' + inp.files.length + ' files...');
    for (let f of inp.files) {
      await fetch('/api/v1/upload', {
        method: 'POST',
        headers: {
          'x-filename': f.name,
          'x-session-token': sessionToken
        },
        body: f
      });
    }
    toast('Upload finished!');
    render();
  };
  inp.click();
}

window.onload = initSession;
</script>
</body>
</html>
